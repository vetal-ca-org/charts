{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kopia.secretName" . }}
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
type: Opaque
stringData:
  repository-password: {{ required "repository.password" .Values.repository.password | quote }}
  ui-password: {{ required "server.uiPassword" .Values.server.uiPassword | quote }}
  users: |
    {{- include "kopia.users" . | trim | nindent 4 }}
{{- end }}
