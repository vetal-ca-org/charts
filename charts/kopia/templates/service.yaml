apiVersion: v1
kind: Service
metadata:
  name: {{ include "kopia.fullname" . }}
  labels:
    {{- include "kopia.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: https
      port: {{ .Values.service.port }}
      targetPort: https
      protocol: TCP
      # TLS end to end (gateway passthrough)
      appProtocol: tls
  selector:
    {{- include "kopia.selectorLabels" . | nindent 4 }}
