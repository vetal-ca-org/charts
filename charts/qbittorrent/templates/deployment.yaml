apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "qbittorrent.fullname" . }}
  labels:
    {{- include "qbittorrent.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One writer on the config volume and the download directories; with hostNetwork
  # the old pod must release the node ports first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "qbittorrent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "qbittorrent.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- if .Values.hostNetwork }}
      hostNetwork: true
      # Cluster DNS from the host network namespace
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Seed (once) and forced settings, before the image's own init
        - name: config
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/bin/sh", "/chart/init.sh"]
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: chart, mountPath: /chart, readOnly: true }
            {{- if .Values.config.seed.hostPath }}
            - { name: seed, mountPath: /seed/seed.tar.gz, readOnly: true }
            {{- end }}
      containers:
        - name: qbittorrent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: PUID
              value: {{ .Values.permissions.uid | quote }}
            - name: PGID
              value: {{ .Values.permissions.gid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: WEBUI_PORT
              value: {{ .Values.webui.port | quote }}
            - name: TORRENTING_PORT
              value: {{ .Values.torrenting.port | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.webui.port }}
              protocol: TCP
            - name: peer-tcp
              containerPort: {{ .Values.torrenting.port }}
              protocol: TCP
            - name: peer-udp
              containerPort: {{ .Values.torrenting.port }}
              protocol: UDP
          {{- $probeHost := "" }}
          {{- if and .Values.webui.address (ne .Values.webui.address "*") }}{{ $probeHost = .Values.webui.address }}{{ end }}
          {{- $host := "" }}
          {{- with $probeHost }}{{ $host = printf ", host: %q" . }}{{ end }}
          {{- with .Values.probes }}
          # Resuming many torrents at start can take a while
          startupProbe:
            tcpSocket: { port: http{{ $host }} }
            periodSeconds: 10
            failureThreshold: {{ .startup.failureThreshold }}
          # qBittorrent serves the Web UI from its main thread, which blocks while it
          # adds large torrents (many files): long timeouts, so a busy instance is
          # neither marked unready nor restarted mid-add.
          readinessProbe:
            httpGet: { path: /, port: http{{ $host }} }
            periodSeconds: {{ .readiness.periodSeconds }}
            timeoutSeconds: {{ .readiness.timeoutSeconds }}
            failureThreshold: {{ .readiness.failureThreshold }}
          livenessProbe:
            httpGet: { path: /, port: http{{ $host }} }
            periodSeconds: {{ .liveness.periodSeconds }}
            timeoutSeconds: {{ .liveness.timeoutSeconds }}
            failureThreshold: {{ .liveness.failureThreshold }}
          {{- end }}
          volumeMounts:
            - { name: config, mountPath: /config }
            {{- range .Values.hostMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: chart
          configMap:
            name: {{ include "qbittorrent.fullname" . }}
        - name: config
          {{- if .Values.config.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "qbittorrent.fullname" . }}-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.config.seed.hostPath }}
        - name: seed
          hostPath:
            path: {{ . | quote }}
            type: File
        {{- end }}
        {{- range .Values.hostMounts }}
        - name: {{ .name }}
          hostPath:
            path: {{ .hostPath | quote }}
            type: Directory
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
