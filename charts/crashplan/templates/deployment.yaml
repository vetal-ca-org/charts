{{- $image := printf "%s:%s" .Values.image.repository (default (printf "v%s" .Chart.AppVersion) .Values.image.tag) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crashplan.fullname" . }}
  labels:
    {{- include "crashplan.labels" . | nindent 4 }}
spec:
  replicas: 1
  # One engine per device identity: the old pod must stop first
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "crashplan.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "crashplan.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.hostname }}
      hostname: {{ . }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.config.seed.hostPath }}
      initContainers:
        # One-time seed, before the image's own init
        - name: seed
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              if [ -d /config/conf ]; then
                echo "/config already has conf/, seed skipped"
              else
                tar -xzf /seed/seed.tar.gz -C /config
                echo "Seeded /config: $(cat /config/cp_version 2>/dev/null || echo 'no cp_version')"
              fi
          volumeMounts:
            - { name: config, mountPath: /config }
            - { name: seed, mountPath: /seed/seed.tar.gz, readOnly: true }
      {{- end }}
      containers:
        - name: crashplan
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext: {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: USER_ID
              value: {{ .Values.permissions.uid | quote }}
            - name: GROUP_ID
              value: {{ .Values.permissions.gid | quote }}
            - name: TZ
              value: {{ .Values.timezone | quote }}
            - name: CRASHPLAN_SRV_MAX_MEM
              value: {{ .Values.maxMemory | quote }}
            - name: WEB_LISTENING_PORT
              value: "5800"
            - name: VNC_LISTENING_PORT
              value: "-1"
            {{- range $k, $v := .Values.extraEnv }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 5800
              protocol: TCP
          # The GUI comes up after the X server and the app: give the first start time
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 60
            failureThreshold: 5
          volumeMounts:
            - { name: config, mountPath: /config }
            {{- range .Values.hostMounts }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              readOnly: {{ if hasKey . "readOnly" }}{{ .readOnly }}{{ else }}true{{ end }}
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          {{- if .Values.config.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "crashplan.fullname" . }}-config
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- with .Values.config.seed.hostPath }}
        - name: seed
          hostPath:
            path: {{ . | quote }}
            type: File
        {{- end }}
        {{- range .Values.hostMounts }}
        - name: {{ .name }}
          hostPath:
            path: {{ .hostPath | quote }}
            type: Directory
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
