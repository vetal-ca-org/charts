replicaCount: 1

image:
  repository: ghcr.io/xtls/xray-core
  tag: ""
  pullPolicy: IfNotPresent

# Keep this equal to the Service name the passthrough ingress routes to.
fullnameOverride: ""

listen: 0.0.0.0
port: 8443
logLevel: warning

# CIDRs that VLESS clients may reach through the freedom outbound (`direct`).
# Adds a routing allow before geoip:private, and a freedom finalRules allow
# (required since Xray 26.4: freedom blackholes private IPs for VLESS by default).
# Leave empty to keep blocking all RFC1918 destinations. Do not open the whole
# private space: that would expose cluster pod, service, and node networks.
privateDirect: []
#  - 172.25.8.0/21
#  - 172.23.80.0/24

# Default flow for a client that does not set one. XTLS-Vision.
flow: xtls-rprx-vision

# One entry per VLESS client. id is the UUID. email is the Xray user label.
clients: []
#  - email: alice
#    id: "00000000-0000-0000-0000-000000000000"
#    flow: xtls-rprx-vision

# REALITY server names. Each name is an SNI and the host in that client's URL.
# The same names must be on the passthrough Gateway and on the fallback certificate.
serverNames: []
#  - mirror.example.com

reality:
  # host:port of the fallback TLS server. Unauthenticated handshakes are forwarded here.
  dest: ""
  privateKey: ""
  shortIds: []

# Cloudflare WARP (1.1.1.1) WireGuard outbound. When enabled, all non-private
# traffic leaves via WARP instead of the node public IP. privateDirect still
# uses freedom. Only secretKey is secret (SOPS); address/endpoint/reserved/mtu
# and peerPublicKey are plain values.
warp:
  enabled: false
  secretKey: ""
  address: []
  #  - 172.16.0.2/32
  #  - 2606:4700:110::/128
  peerPublicKey: bmXOC+F1FxEMF9dyiK2H5/1SUtzH0JuVo51h2wPfgyo=
  endpoint: engage.cloudflareclient.com:2408
  # How Xray resolves a hostname endpoint (streamSettings.sockopt.domainStrategy
  # on the warp outbound). Xray picks a random A/AAAA record otherwise; WARP
  # often ignores WireGuard handshakes over IPv6, so dual-stack pods break at
  # random. ForceIPv4 keeps the hostname but only uses its A records.
  # Empty string = Xray default (both families, random pick).
  endpointDomainStrategy: ForceIPv4
  reserved: []
  #  - 0
  #  - 0
  #  - 0
  mtu: 1280
  # WireGuard persistent keepalive (seconds) on the WARP peer. Keeps the NAT
  # mapping of the long-lived UDP flow warm. 0 = off.
  keepAlive: 25
  # WARP egress watchdog. Xray keeps one UDP source port for its whole life;
  # when that flow dies (no handshake replies), it never recovers on its own,
  # while a new source port works at once. A sidecar fetches `url` through a
  # local HTTP inbound routed to `warp`, and serves /healthz while that works.
  # The xray container's livenessProbe points at it, so the kubelet restarts
  # xray (new socket, new source port) after about
  # (failures * interval) + (probe failureThreshold * periodSeconds).
  healthCheck:
    enabled: true
    image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
    # Plain HTTP: busybox wget has no reliable TLS. 204 from Cloudflare.
    url: http://cp.cloudflare.com/generate_204
    interval: 30        # seconds between checks
    timeout: 10         # seconds per check
    failures: 2         # consecutive failed checks before /healthz goes away
    proxyPort: 10809    # xray HTTP inbound on 127.0.0.1, routed to warp
    port: 8099          # sidecar httpd (pod IP; kubelet probes it)

service:
  port: 443

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 256Mi
