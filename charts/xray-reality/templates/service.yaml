apiVersion: v1
kind: Service
metadata:
  name: {{ include "xray-reality.fullname" . }}
  labels:
    {{- include "xray-reality.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "xray-reality.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-vless
      port: {{ .Values.service.port }}
      targetPort: vless
