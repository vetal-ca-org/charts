apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "xray-reality.fullname" . }}
  labels:
    {{- include "xray-reality.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "xray-reality.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "xray-reality.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: xray
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["run", "-c", "/etc/xray/config.json"]
          ports:
            - name: vless
              containerPort: {{ .Values.port }}
          readinessProbe:
            tcpSocket:
              port: vless
            timeoutSeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: cfg
              mountPath: /etc/xray
              readOnly: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: cfg
          secret:
            secretName: {{ include "xray-reality.configSecret" . }}
