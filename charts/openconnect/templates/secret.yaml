apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openconnect.secretName" . }}
  labels:
    {{- include "openconnect.labels" . | nindent 4 }}
type: Opaque
data:
  ocpasswd: {{ include "openconnect.ocpasswd" . | b64enc | quote }}
  {{- if .Values.warp.enabled }}
  warp-private-key: {{ required "warp.privateKey (wgcf registration) when warp.enabled" .Values.warp.privateKey | b64enc | quote }}
  {{- end }}
