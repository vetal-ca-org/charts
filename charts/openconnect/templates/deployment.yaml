apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openconnect.fullname" . }}
  labels:
    {{- include "openconnect.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  progressDeadlineSeconds: {{ .Values.deployment.progressDeadlineSeconds }}
  selector:
    matchLabels:
      {{- include "openconnect.selectorLabels" . | nindent 6 }}
  strategy:
    type: {{ ternary "Recreate" "RollingUpdate" .Values.hostNetwork }}
  template:
    metadata:
      labels:
        {{- include "openconnect.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "openconnect.configChecksum" . | quote }}
        # ocpasswd is a subPath mount, which never sees Secret updates; roll the pod.
        checksum/users: {{ include "openconnect.ocpasswd" . | sha256sum | printf "%.8s" | quote }}
        {{- if .Values.warp.enabled }}
        checksum/warp: {{ printf "%s%s" (include "openconnect.warpScript" .) (toJson .Values.warp) | sha256sum | printf "%.8s" | quote }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      hostNetwork: {{ .Values.hostNetwork }}
      terminationGracePeriodSeconds: {{ .Values.deployment.terminationGracePeriodSeconds }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ default (include "openconnect.fullname" .) .Values.serviceAccount.name }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: ocserv
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: vpn
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
            {{- if .Values.udpService.enabled }}
            - name: dtls
              containerPort: {{ .Values.config.udpPort }}
              protocol: UDP
            {{- end }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/ocserv/ocserv.conf
              subPath: ocserv.conf
            {{- if and .Values.defaultGroup (ne (len .Values.defaultGroup) 0) }}
            - name: config
              mountPath: /etc/ocserv/defaults/group.conf
              subPath: default-group.conf
            {{- end }}
            {{- $groups := .Values.groups | default dict }}
            {{- $keys := keys $groups | sortAlpha }}
            {{- range $idx, $key := $keys }}
            {{- $group := index $groups $key }}
            {{- if $group.enabled }}
            {{- $groupCtx := dict "group" $group "key" $key }}
            - name: config
              mountPath: /etc/ocserv/config-per-group/{{ include "openconnect.groupName" $groupCtx }}
              subPath: group-{{ include "openconnect.groupFileKey" $groupCtx }}.conf
            {{- end }}
            {{- end }}
            - name: auth
              mountPath: {{ .Values.auth.passwdFile }}
              subPath: ocpasswd
            {{- if include "openconnect.tlsSecretName" . }}
            - name: tls
              mountPath: /etc/ocserv/ssl
              readOnly: true
            {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if .Values.warp.enabled }}
        # Shares the pod network namespace: adds interface "warp" and the routing for it
        - name: warp
          image: {{ .Values.warp.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/warp/warp.sh"]
          env:
            - name: WARP_NETWORK
              value: {{ .Values.config.ipv4Network | quote }}
            - name: WARP_NETMASK
              value: {{ .Values.config.ipv4Netmask | quote }}
            - name: WARP_ADDRESS
              value: {{ .Values.warp.address | quote }}
            - name: WARP_PEER_PUBLIC_KEY
              value: {{ .Values.warp.peerPublicKey | quote }}
            - name: WARP_ENDPOINT
              value: {{ .Values.warp.endpoint | quote }}
            - name: WARP_MTU
              value: {{ .Values.warp.mtu | quote }}
            - name: WARP_DIRECT_NETWORKS
              value: {{ join " " .Values.warp.directNetworks | quote }}
            - name: WARP_CHECK_HOST
              value: {{ .Values.warp.check.host | quote }}
            - name: WARP_CHECK_INTERVAL
              value: {{ .Values.warp.check.intervalSeconds | quote }}
            - name: WARP_CHECK_FAILURES
              value: {{ .Values.warp.check.failures | quote }}
          securityContext:
            runAsUser: 0
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: warp-script
              mountPath: /opt/warp
              readOnly: true
            - name: warp-key
              mountPath: /etc/warp
              readOnly: true
          {{- with .Values.warp.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "openconnect.configName" . }}
        - name: auth
          secret:
            secretName: {{ include "openconnect.secretName" . }}
        {{- if .Values.warp.enabled }}
        - name: warp-script
          configMap:
            name: {{ include "openconnect.fullname" . }}-warp
        - name: warp-key
          secret:
            secretName: {{ include "openconnect.secretName" . }}
            defaultMode: 0400
            items:
              - key: warp-private-key
                path: private-key
        {{- end }}
        {{- with include "openconnect.tlsSecretName" . }}
        - name: tls
          secret:
            secretName: {{ . }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

